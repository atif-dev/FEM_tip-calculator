<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="description" content="Frontendmentor tip calculator"> 
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<link rel="icon" href="./images/favicon.svg">
	<link rel="stylesheet" type="text/css" href="style.css">
	<script defer src="script.js"></script>

	<title>Frontend Mentor | Tip calculator</title>
</head>
<body>
	<main>
      <div class="logo">
        <img src="./images/logo.svg" alt="logo in english alphabets, written as splitter." />
      </div>
      <div class="sections">
        <section class="section-one">
          <div class="bill-label-error-msg">
            <label class="labels" for="bill_input">Bill</label>
            <span id="bill_error_msg" class="bill-error-msg"></span>
          </div>
          <input id="bill_input" class="bill-input" type="number" min="0" placeholder="0" />
          <label class="labels tip-label" for="select-tip">Select Tip %</label>
          <div class="tips-values">
            <div class="tip-value1">
              <button data-tip-value="5">5%</button>
              <button data-tip-value="10">10%</button>
              <button data-tip-value="15">15%</button>
            </div>
            <div class="tip-value2">
              <button data-tip-value="25">25%</button>
              <button data-tip-value="50">50%</button>
              <input id="custom_input" class="custom-input" type="number" placeholder="Custom" title='Custom input is in %'/>
            </div>
          </div>

        <!-- mobile tip section -->
        <div class="tips-values-mobile">
          <div class="tip-value1-mobile">
            <div data-tip-value="5">5%</div>
            <div data-tip-value="10">10%</div>
          </div>
          <div class="tip-value2-mobile">
            <div data-tip-value="15">15%</div>
            <div data-tip-value="25">25%</div> 
          </div>
          <div class="tip-value3-mobile">
            <div data-tip-value="50">50%</div>
            <input id="custom_input_mobile" class="custom-input-mobile" type="number" placeholder="Custom" title="Custom input is in %"/>
          </div>
        </div>
          <div class="people-label-error-msg">
            <label class="labels" for="people_input">Number of People</label>
            <span id="people_error_msg" class="people-error-msg"></span>
          </div>
          <input id="people_input" class="people-input" type="number" placeholder="0" />
        </section>
        <section class="section-two">
          <div class="amounts">
            <div class="section-two-sub1">
              <p>Tip Amount<span>/ person</span></p>
              <p id="tip_per_person" class="tip-amount">$0.00</p>
            </div>
            <div class="section-two-sub2">
              <p>Total<span>/ person</span></p>
              <p id="bill_per_person" class="total-amount">$0.00</p>
            </div>
          </div>
          <div class="section-two-sub3">
            <button id="reset_btn" class="reset-btn">Reset</button>
          </div>
        </section>
      </div>
    </main>
</body>
</html>
